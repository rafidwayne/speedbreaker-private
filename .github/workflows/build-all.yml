name: Build all (one click)

# Builds SpeedBreaker.exe and SpeedBreakerLauncher.exe and bundles them in one zip.
# Run it from the Actions tab (Run workflow). It needs your own default.xex, from either:
#   1. a release asset named default.xex on a release tagged "xex" in THIS repository
#      (scripts/setup-private-copy.sh creates it), or
#   2. the XEX_URL secret (and XEX_AUTH, if the URL needs a header), as in game.yml.
# The repository must be PRIVATE: the job stops on a public one, so the xex can't leak.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    uses: ./.github/workflows/launcher.yml

  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      XEX_URL: ${{ secrets.XEX_URL }}
      XEX_AUTH: ${{ secrets.XEX_AUTH }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse to run on a public repository
        run: |
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "::error::This repository is public. default.xex is your own game file and must not be handled here. Make the repository private, or use a private copy."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Free disk space (the build needs about 10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Fetch default.xex
        run: |
          if [ -n "$XEX_URL" ]; then
            args=(-fsSL --retry 3 -o "$RUNNER_TEMP/default.xex")
            if [ -n "$XEX_AUTH" ]; then args+=(-H "$XEX_AUTH"); fi
            curl "${args[@]}" "$XEX_URL"
          else
            gh release download xex --pattern default.xex --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY" || {
              echo "::error::No default.xex. Attach it to a release tagged 'xex' in this repository, or set the XEX_URL secret. See scripts/setup-private-copy.sh."
              exit 1
            }
          fi
          echo "aebdf3c14d1e4e4ed2c130d94bc1a0e97bd6d5bf39bdfdef33c3909c9cc4ba4c  $RUNNER_TEMP/default.xex" | sha256sum -c -

      - name: Build (win-build/ci-build.sh)
        run: win-build/ci-build.sh "$RUNNER_TEMP/default.xex"

      - name: Remove default.xex and fix file ownership (the build ran as root)
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/default.xex" game/files/default.xex
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/upload-artifact@v4
        with:
          name: SpeedBreaker
          path: |
            dist/SpeedBreaker.exe
            dist/SpeedBreaker.exe.sha256

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            /home/claude/ppc_fail.log
            /home/claude/deps/ffconf.log
            /home/claude/deps/FAIL
          if-no-files-found: ignore

  package:
    needs: [launcher, game]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpeedBreaker
          path: pkg
      - uses: actions/download-artifact@v4
        with:
          name: SpeedBreakerLauncher
          path: pkg
      - name: Zip (the exe, the launcher and their checksums; no game files)
        run: |
          cd pkg && ls -l && zip -9 ../SpeedBreaker-Windows.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: SpeedBreaker-Windows
          path: SpeedBreaker-Windows.zip
